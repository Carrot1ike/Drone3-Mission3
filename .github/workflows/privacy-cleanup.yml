name: Mission3 privacy cleanup
on:
  push:
    branches: [main]
    paths: ['scripts/privacy_export.py', '.github/workflows/privacy-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mission3-privacy-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'Carrot1ike/Drone3-Mission3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify originals, export, rewrite, and replace attachments
        run: python3 scripts/privacy_export.py publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
