<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1300" viewBox="0 0 1700 1300" role="img"><title>미션3 단계 인터페이스 · 현재 구현</title><rect x="0" y="0" width="1700" height="1300" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="55" y="30" font-family="Noto Sans CJK KR, sans-serif" font-size="36" fill="#183047" text-anchor="start" dominant-baseline="text-before-edge">미션 3 · 단계와 종료 조건</text><text x="55" y="88" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="start" dominant-baseline="text-before-edge">공통 명령: phase · 세계 속도 · yawrate · motoroff · done · failure / 결과는 독립 평가</text><rect x="55" y="180" width="450" height="175" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="280.0" y="197" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">HANDOFF_IN → WAIT</text><text x="280.0" y="238" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">알려진 진입점·정면·높이1m</text><text x="280.0" y="271" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">15초 fixed gaze</text><text x="280.0" y="304" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">이전 미션 EKF 연속 인계 U</text><rect x="625" y="180" width="450" height="175" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="850.0" y="197" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">EXPLORE → WATCH</text><text x="850.0" y="238" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">정적 지도 감시점으로 이동</text><text x="850.0" y="271" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">작은 yaw sweep으로 기다림</text><text x="850.0" y="304" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">트랙 영상 인식 가정 없음</text><rect x="1195" y="180" width="450" height="175" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="1420.0" y="197" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">COARSE → ACQUIRE</text><text x="1420.0" y="238" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">ID/bearing은 탐색만 허용</text><text x="1420.0" y="271" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">정밀 pose 검사 통과 필요</text><text x="1420.0" y="304" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">차량 운동 추정 초기화</text><rect x="1195" y="450" width="450" height="175" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="1420.0" y="467" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">LINEUP → LOWER_ALIGN</text><text x="1420.0" y="508" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">차량 뒤 .65m 정렬</text><text x="1420.0" y="541" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">속도·방향 오차 감소</text><text x="1420.0" y="574" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">가시 높이로 낮춤</text><rect x="625" y="450" width="450" height="175" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="850.0" y="467" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">APPROACH → TRACK</text><text x="850.0" y="508" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">추정 차량 속도 FF + 상대 FB</text><text x="850.0" y="541" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">남은 직선·영상 품질 확인</text><text x="850.0" y="574" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">곡선에서는 착륙 보류</text><rect x="55" y="450" width="450" height="175" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="280.0" y="467" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">BLIND_APPROACH/DESCEND</text><text x="280.0" y="508" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">마지막 신뢰 영상부터 제한 예측</text><text x="280.0" y="541" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">순수 패드 Flow일 때만 하강</text><text x="280.0" y="574" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">물리 adapter 인계 높이11cm</text><rect x="55" y="720" width="450" height="175" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="280.0" y="737" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">TOUCHDOWN_DESCEND</text><text x="280.0" y="778" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">Flow/ToF 근거리 융합 차단</text><text x="280.0" y="811" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">IMU + 마지막 상대 상태 예측</text><text x="280.0" y="844" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">명령 추력/IMU 지지 후보</text><rect x="625" y="720" width="450" height="175" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="850.0" y="737" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">MOTOR_OFF_HOLD</text><text x="850.0" y="778" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">지지 후보 확인 후 PWM0</text><text x="850.0" y="811" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">3초 IMU 안정성 검사</text><text x="850.0" y="844" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">네 발 접촉은 온라인 입력 아님</text><rect x="1195" y="720" width="450" height="175" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="1420.0" y="737" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">RESULT_OUT</text><text x="1420.0" y="778" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">LANDED_PENDING_REVIEW</text><text x="1420.0" y="811" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">오프라인 접촉·모터·3초 평가</text><text x="1420.0" y="844" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">독립 리뷰/제조사 프로파일 검사</text><polyline points="505,265 625,265" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="625.00,265.00 613.29,270.65 613.29,259.35" fill="#687e91" /><polyline points="1075,265 1195,265" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1195.00,265.00 1183.29,270.65 1183.29,259.35" fill="#687e91" /><polyline points="1420,355 1420,450" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1420.00,450.00 1414.35,438.29 1425.65,438.29" fill="#687e91" /><polyline points="1195,535 1075,535" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1075.00,535.00 1086.71,529.35 1086.71,540.65" fill="#687e91" /><polyline points="625,535 505,535" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="505.00,535.00 516.71,529.35 516.71,540.65" fill="#687e91" /><polyline points="280,625 280,720" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="280.00,720.00 274.35,708.29 285.65,708.29" fill="#687e91" /><polyline points="505,805 625,805" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="625.00,805.00 613.29,810.65 613.29,799.35" fill="#687e91" /><polyline points="1075,805 1195,805" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1195.00,805.00 1183.29,810.65 1183.29,799.35" fill="#687e91" /><rect x="55" y="1010" width="1590" height="225" rx="12" fill="#fff5e2" stroke="#687e91" stroke-width="2" /><text x="850.0" y="1027" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">실패 복구와 집계</text><text x="850.0" y="1068" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">낮은 terminal에서 영상 상한·센서 품질·직선 여유 위반 → 제한된 후퇴 FF + 상승 → FF 종료·제동 → 안전 추정 높이에서 ABORT</text><text x="850.0" y="1101" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">모터off 뒤 지지 불확실 → sensor support unconfirmed / 재시동 정책 미구현</text><text x="850.0" y="1134" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">광학점 GEOMETRY_READY는 접촉이 아님. 조건부 접촉과 제조사 일치 성공을 별도 집계하고 실패 분모를 유지</text><text x="850.0" y="1167" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">진입1의 자격 있는 독립 성공5회 전에는 다음 진입점 승격하지 않음</text><polyline points="280,895 280,1010" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" /><polygon points="280.00,1010.00 274.35,998.29 285.65,998.29" fill="#687e91" /></svg>