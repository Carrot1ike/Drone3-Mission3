<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1400" viewBox="0 0 1700 1400" role="img"><title>미션3 현재 제어 구조 · 조건부 물리 시험</title><rect x="0" y="0" width="1700" height="1400" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="55" y="30" font-family="Noto Sans CJK KR, sans-serif" font-size="36" fill="#183047" text-anchor="start" dominant-baseline="text-before-edge">미션 3 · 현재 제어 구조</text><text x="55" y="88" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="start" dominant-baseline="text-before-edge">영상으로 차량을 발견하고, 추정 차량 속도 FF + 상대 상태 FB로 정렬·추종·착륙</text><text x="55" y="133" font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#536679" text-anchor="start" dominant-baseline="text-before-edge">고정 조건: mono8 320×320 · 20×20cm 패드 · 높이30cm · 차량0.25m/s (plant 전용)</text><rect x="40" y="200" width="1100" height="950" rx="12" fill="#f6f9fe" stroke="#c6d5e5" stroke-width="2" /><rect x="1190" y="200" width="465" height="950" rx="12" fill="#f6faf7" stroke="#c7d8cc" stroke-width="2" /><text x="590" y="217" font-family="Noto Sans CJK KR, sans-serif" font-size="26" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">상위 추정·단계 제어 · PC에서 계산</text><text x="1422" y="217" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">제조사 C + 조건부 물리</text><rect x="70" y="280" width="320" height="155" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="230.0" y="297" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">AI-deck 가상 영상</text><text x="230.0" y="338" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">native 단색 320×320</text><text x="230.0" y="371" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">공칭 FOV87° / K·왜곡 U</text><text x="230.0" y="404" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">촬영 시각·실기 지연 U</text><rect x="430" y="280" width="310" height="155" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="585.0" y="297" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">ArUco 상대 관측</text><text x="585.0" y="338" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">ID · IPPE 두 후보</text><text x="585.0" y="371" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">capture 시각 IMU 자세</text><text x="585.0" y="404" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">coarse 방위 ≠ 정밀 pose</text><rect x="780" y="280" width="325" height="155" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="942.5" y="297" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">차량 운동 추정</text><text x="942.5" y="338" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">마커 → 패드 고정 변환</text><text x="942.5" y="371" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">영상 회귀 + 자기 운동</text><text x="942.5" y="404" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">차량 위치·방향·속도 미지</text><polyline points="390,350 430,350" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="430.00,350.00 418.29,355.65 418.29,344.35" fill="#687e91" /><polyline points="740,350 780,350" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="780.00,350.00 768.29,355.65 768.29,344.35" fill="#687e91" /><rect x="70" y="500" width="320" height="155" rx="12" fill="#eaf4ed" stroke="#687e91" stroke-width="2" /><text x="230.0" y="517" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">가상 IMU · Flow · ToF</text><text x="230.0" y="558" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">IMU1kHz / Flow100Hz</text><text x="230.0" y="591" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">ToF40Hz · 유한 표면 patch</text><text x="230.0" y="624" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">모델·잡음·장착은 S</text><rect x="430" y="500" width="310" height="155" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="585.0" y="517" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">자기 상태 · 표면 가설</text><text x="585.0" y="558" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">바닥 / 패드 / 혼합 / 모호</text><text x="585.0" y="591" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">Flow는 관측 표면 상대 속도</text><text x="585.0" y="624" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">높이는 바닥·패드 기준 분리</text><rect x="780" y="500" width="325" height="155" rx="12" fill="#fff5e2" stroke="#687e91" stroke-width="2" /><text x="942.5" y="517" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">센서 사용 경계</text><text x="942.5" y="558" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">부품 권장 범위의 보수 gate</text><text x="942.5" y="591" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">Flow &lt;8cm: 융합 제외</text><text x="942.5" y="624" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">ToF &lt;4cm: 높이 융합 제외</text><polyline points="390,570 430,570" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="430.00,570.00 418.29,575.65 418.29,564.35" fill="#687e91" /><polyline points="780,570 740,570" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="740.00,570.00 751.71,564.35 751.71,575.65" fill="#687e91" /><polyline points="585,500 585,450 942,450 942,420" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="942.00,420.00 947.65,431.71 936.35,431.71" fill="#687e91" /><rect x="70" y="715" width="1035" height="135" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="587.5" y="732" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">단계·안전 게이트</text><text x="587.5" y="773" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">15초 대기 → 탐색 → 인식 → 후방 정렬 → 접근 → 추종 → 제한된 하강</text><text x="587.5" y="806" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">영상 나이 · 직선 잔여 길이 · 상대 오차 · 센서 품질 · 실패 시 상승 복구</text><polyline points="942,655 942,715" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="942.00,715.00 936.35,703.29 947.65,703.29" fill="#687e91" /><polyline points="585,655 585,715" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="585.00,715.00 579.35,703.29 590.65,703.29" fill="#687e91" /><rect x="70" y="925" width="480" height="155" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="310.0" y="942" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">FF + FB 속도·yaw 명령</text><text x="310.0" y="983" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">FF = 추정 차량 속도</text><text x="310.0" y="1016" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">FB = 상대 위치·속도·방향 오차</text><text x="310.0" y="1049" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">속도·가속도·회전율 제한</text><rect x="605" y="925" width="500" height="155" rx="12" fill="#fff5e2" stroke="#687e91" stroke-width="2" /><text x="855.0" y="942" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">접촉 후보 · 모터 종료</text><text x="855.0" y="983" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">공중 명령 추력 / IMU 응답 비율 보정</text><text x="855.0" y="1016" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">collective probe + 지지 residual</text><text x="855.0" y="1049" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">모터0 뒤 IMU 안정성3초</text><polyline points="310,850 310,925" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="310.00,925.00 304.35,913.29 315.65,913.29" fill="#687e91" /><polyline points="855,850 855,925" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="855.00,925.00 849.35,913.29 860.65,913.29" fill="#687e91" /><rect x="1220" y="280" width="405" height="170" rx="12" fill="#eaf4ed" stroke="#687e91" stroke-width="2" /><text x="1422.5" y="297" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">하위 상태 공급</text><text x="1422.5" y="338" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">공식 Kalman core IMU 자세 전파</text><text x="1422.5" y="371" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">위치·속도는 프로젝트 표면 추정</text><text x="1422.5" y="404" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">stock 전체 EKF 재현 아님</text><rect x="1220" y="560" width="405" height="155" rx="12" fill="#eaf4ed" stroke="#687e91" stroke-width="2" /><text x="1422.5" y="577" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">공식 PID · mixer · 전압 보정</text><text x="1422.5" y="618" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">공식 C 원문 host 실행</text><text x="1422.5" y="651" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">세계 속도 + yawrate → PWM</text><text x="1422.5" y="684" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">RTOS · 통신 · 실기 구현 미완</text><rect x="1220" y="840" width="405" height="160" rx="12" fill="#eaf4ed" stroke="#687e91" stroke-width="2" /><text x="1422.5" y="857" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">MuJoCo 자유 기체</text><text x="1422.5" y="898" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">PWM → 조건부 motor model</text><text x="1422.5" y="931" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">힘·토크 → 운동 · 접촉</text><text x="1422.5" y="964" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">기체 pose 강제 이동 없음</text><polyline points="1422,450 1422,560" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1422.00,560.00 1416.35,548.29 1427.65,548.29" fill="#687e91" /><polyline points="1422,715 1422,840" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1422.00,840.00 1416.35,828.29 1427.65,828.29" fill="#687e91" /><polyline points="550,995 575,995 575,1120 1160,1120 1160,640 1220,640" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1220.00,640.00 1208.29,645.65 1208.29,634.35" fill="#687e91" /><polyline points="1105,1005 1180,1005 1180,690 1220,690" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" /><polygon points="1220.00,690.00 1208.29,695.65 1208.29,684.35" fill="#687e91" /><polyline points="1220,925 1175,925 1175,475 210,475 210,500" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" /><polygon points="210.00,500.00 204.35,488.29 215.65,488.29" fill="#687e91" /><rect x="55" y="1200" width="1590" height="150" rx="12" fill="#fff5e2" stroke="#687e91" stroke-width="2" /><text x="850.0" y="1217" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">독립 오프라인 평가 · 실행 후만 읽기</text><text x="850.0" y="1258" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">참 위치·접촉 쌍·네 발·모터0·3초 유지·직선·실패 분모 → 독립 검토 → 새 코드/설정으로 재시험</text><text x="850.0" y="1291" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">제어기로 참 차량 상태·속도·접촉을 전달하지 않음 / 조건부 접촉 성공 ≠ 제조사 일치 성공</text><text x="850.0" y="1324" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">P: 제조사 공개 사실 · C: 공식 소프트웨어 모델 · S: 민감도 가정 · U: 미확정</text><polyline points="1422,1000 1422,1200" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1422.00,1200.00 1416.35,1188.29 1427.65,1188.29" fill="#687e91" /></svg>