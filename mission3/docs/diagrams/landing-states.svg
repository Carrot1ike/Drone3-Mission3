-baseline="text-before-edge">하강</text><text x="1178.0" y="235" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">수평·방향</text><text x="1178.0" y="268" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">추종 계속</text><polyline points="1293,247 1315,247" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1315.00,247.00 1303.29,252.65 1303.29,241.35" fill="#687e91" /><rect x="1315" y="177" width="230" height="143" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="1430.0" y="194" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">접촉 확인</text><text x="1430.0" y="235" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">접촉 검증 후</text><text x="1430.0" y="268" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">모터 종료</text><rect x="560" y="400" width="500" height="125" rx="12" fill="#fff5e2" stroke="#687e91" stroke-width="2" /><text x="810.0" y="417" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">재획득 또는 중단</text><text x="810.0" y="458" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">관측 복구 후 단계·목표를 다시 확인</text><polyline points="422,320 422,353 810,353 810,400" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" /><polygon points="810.00,400.00 804.35,388.29 815.65,388.29" fill="#687e91" /><polyline points="674,320 674,353 810,353 810,400" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7