<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="570" viewBox="0 0 1600 570" role="img"><title>착륙 단계와 관측 손실 처리</title><rect x="0" y="0" width="1600" height="570" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="55" y="27" font-family="Noto Sans CJK KR, sans-serif" font-size="36" fill="#183047" text-anchor="start" dominant-baseline="text-before-edge">착륙 단계 · 상태에 따라 전환</text><text x="55" y="91" font-family="Noto Sans CJK KR, sans-serif" font-size="26" fill="#536679" text-anchor="start" dominant-baseline="text-before-edge">인식 → 일자 정렬 → 접근 → 속도 맞추기 → 하강 → 접촉 확인</text><rect x="55" y="177" width="230" height="143" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="170.0" y="194" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">인식</text><text x="170.0" y="235" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">지정 마커</text><text x="170.0" y="268" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">안정적 관측</text><polyline points="285,247 307,247" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="307.00,247.00 295.29,252.65 295.29,241.35" fill="#687e91" /><rect x="307" y="177" width="230" height="143" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="422.0" y="194" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">일자 정렬</text><text x="422.0" y="235" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">방향·중심선</text><text x="422.0" y="268" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">오차 감소</text><polyline