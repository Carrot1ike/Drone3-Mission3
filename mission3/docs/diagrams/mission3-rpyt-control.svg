21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">최근 보정·추정 상판 높이 조건</text><text x="855.0" y="1111" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">최종6초·추력 probe·IMU 지지 잔차</text><text x="855.0" y="1144" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">PWM0 뒤 IMU3초 / 공중 오판 한계</text><polyline points="310,940 310,1020" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="310.00,1020.00 304.35,1008.29 315.65,1008.29" fill="#687e91" /><polyline points="855,940 855,1020" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="855.00,1020.00 849.35,1008.29 860.65,1008.29" fill="#687e91" /><rect x="70" y="1240" width="1035" height="105" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="587.5" y="1257" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">PC 공식 velocity PID → RPYT packet100Hz</text><text x="587.5" y="1298" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">roll·pitch·yawrate·legacy collective / zero unlock·zero stop·명령 모드 검증</text><polyline points="310,1175 310,1240" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="310.00,1240.00 304.35,1228.29 315.65,1228.29" fill="#687e91" /><polyline points="855,1175 855,1240" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" /><polygon points="855.00,1240.00 849.35,1228.29 860.65,1228.29" fill="#687e91" /><rect x="1220" y="285" width="405" height="170" rx="12" fill="#eaf4ed" stroke="#687e91" stroke-width="2" /><text x="1422.5" y="302" font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#183047" text-a