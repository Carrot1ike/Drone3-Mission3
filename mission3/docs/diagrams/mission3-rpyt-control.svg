dth="2" /><text x="942.5" y="547" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">표면·자기 운동 추정</text><text x="942.5" y="588" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">바닥에서 수평 IMU 잔차 fit S</text><text x="942.5" y="621" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">이동·혼합 표면 갱신 금지</text><text x="942.5" y="654" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">Flow8cm · ToF4cm/무늬 gate</text><polyline points="390,615 430,615" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="430.00,615.00 418.29,620.65 418.29,609.35" fill="#687e91" /><polyline points="740,615 780,615" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="780.00,615.00 768.29,620.65 768.29,609.35" fill="#687e91" /><polyline points="215,530 215,492 940,492 940,530" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" /><polygon points="940.00,530.00 934.35,518.29 945.65,518.29" fill="#687e91" /><polyline points="585,530 585,455" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" /><polygon points="585.00,455.00 590.65,466.71 579.35,466.71" fill="#687e91" /><rect x="70" y="785" width="1035" height="155" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="587.5" y="802" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">단계·인계·제한 게이트</text><text x="587.5" y="843" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">센서1m 인계 → WAIT15초 → 가까운 지도 관측점 → 마커 획득</