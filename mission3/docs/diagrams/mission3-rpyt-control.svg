" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">힘으로 움직이고 실제 상판 접촉</text><text x="1422.5" y="939" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">기체 pose 강제 이동 없음</text><rect x="1220" y="1110" width="405" height="205" rx="12" fill="#fff5e2" stroke="#687e91" stroke-width="2" /><text x="1422.5" y="1127" font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">현실과의 차이를 명시</text><text x="1422.5" y="1168" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">실기 K/D·deck 장착·CoM·관성 U</text><text x="1422.5" y="1201" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">모터/전압/접촉·센서 전달 모델 S</text><text x="1422.5" y="1234" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">Flow 무늬 gate ≠ 실제 SQUAL</text><text x="1422.5" y="1267" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">공식 알고리즘 ≠ 제조사 완성 기체</text><polyline points="1422,455 1422,545" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1422.00,545.00 1416.35,533.29 1427.65,533.29" fill="#687e91" /><polyline points="1422,715 1422,815" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1422.00,815.00 1416.35,803.29 1427.65,803.29" fill="#687e91" /><polyline points="1105,1292 1170,1292 1170,630 1220,630" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1220.00,630.00 1208.29,635.65 1208.29,624.35" fill="#687e91" /><polyline points="1220,900 1150,900 1150,477 215,477 215,530" fill="none" stroke="#687e91" stroke