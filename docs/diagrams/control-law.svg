<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img"><title>차량 운동 피드포워드와 위치 오차 피드백</title><rect x="0" y="0" width="1600" height="940" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="55" y="27" font-family="Noto Sans CJK KR, sans-serif" font-size="36" fill="#183047" text-anchor="start" dominant-baseline="text-before-edge">수평 제어 · 피드포워드 + 피드백</text><text x="55" y="91" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#536679" text-anchor="start" dominant-baseline="text-before-edge">설명용 기준식: 기체·차량의 일관된 세계 위치·속도 추정이 확보된 경우</text><rect x="55" y="195" width="400" height="155" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="255.0" y="212" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">동일 좌표계의 상태 추정</text><text x="255.0" y="253" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">기체 위치 · 차량 위치·속도</text><text x="255.0" y="286" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">마커 → 착륙점의 고정 변환</text><rect x="55" y="470" width="400" height="140" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="255.0" y="487" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">단계별 수평 목표</text><text x="255.0" y="528" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">접근 지점 → 착륙장 중심</text><text x="255.0" y="561" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">p_target</text><rect x="590" y="205" width="440" height="120" rx="12" fill="#fff5e2" stroke="#687e91" stroke-width="2" /><text x="810.0" y="222" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">차량 운동 예측 · 피드포워드</text><text x="810.0" y="263" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">v_ff = v_vehicle_hat</text><rect x="590" y="470" width="210" height="140" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="695.0" y="487" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">위치 오차</text><text x="695.0" y="528" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">e = p_target</text><text x="695.0" y="561" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">− p_drone_hat</text><rect x="845" y="470" width="210" height="140" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="950.0" y="487" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">피드백 보정</text><text x="950.0" y="528" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">v_correction</text><text x="950.0" y="561" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">= Kp × e</text><circle cx="1130" cy="387" r="29" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="1130" y="373" font-family="Noto Sans CJK KR, sans-serif" font-size="36" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">+</text><rect x="1200" y="325" width="345" height="150" rx="12" fill="#eaf4ed" stroke="#687e91" stroke-width="2" /><text x="1372.5" y="342" font-family="Noto Sans CJK KR, sans-serif" font-size="25" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">속도 목표</text><text x="1372.5" y="383" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">v_command</text><text x="1372.5" y="416" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">= v_ff + v_correction</text><text x="1372.5" y="449" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">좌표 기준 확인 · 목표 제한</text><rect x="1200" y="700" width="345" height="125" rx="12" fill="#eaf4ed" stroke="#687e91" stroke-width="2" /><text x="1372.5" y="717" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">CFLib → 기체 내부 제어</text><text x="1372.5" y="758" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">목표 추종 → 기체 운동</text><polyline points="455,265 590,265" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="590.00,265.00 578.29,270.65 578.29,259.35" fill="#687e91" /><text x="522" y="228" font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">차량 속도 추정</text><polyline points="255,350 255,470" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="255.00,470.00 249.35,458.29 260.65,458.29" fill="#687e91" /><polyline points="455,540 590,540" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="590.00,540.00 578.29,545.65 578.29,534.35" fill="#687e91" /><text x="550" y="502" font-family="Noto Sans CJK KR, sans-serif" font-size="19" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">p_target</text><polyline points="455,303 503,303 503,658 695,658 695,610" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="695.00,610.00 700.65,621.71 689.35,621.71" fill="#687e91" /><text x="660" y="670" font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">p_drone_hat</text><polyline points="800,540 845,540" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="845.00,540.00 833.29,545.65 833.29,534.35" fill="#687e91" /><polyline points="1030,265 1130,265 1130,358" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1130.00,358.00 1124.35,346.29 1135.65,346.29" fill="#687e91" /><polyline points="1055,540 1130,540 1130,416" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1130.00,416.00 1135.65,427.71 1124.35,427.71" fill="#687e91" /><polyline points="1159,387 1200,387" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1200.00,387.00 1188.29,392.65 1188.29,381.35" fill="#687e91" /><polyline points="1372,475 1372,700" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1372.00,700.00 1366.35,688.29 1377.65,688.29" fill="#687e91" /><text x="1372" y="561" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">지원되는 목표값으로 전송</text><text x="1372" y="594" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">세계 속도 API 사용은 조건부</text><polyline points="1372,825 1372,865 27,865 27,271 55,271" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="55.00,271.00 43.29,276.65 43.29,265.35" fill="#687e91" /><text x="715" y="833" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">영상·센서 관측 → 상태 추정 → 오차 보정</text><text x="55" y="903" font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#536679" text-anchor="start" dominant-baseline="text-before-edge">수직 하강·yaw 추종·접촉 판단은 단계 관리와 함께 실행합니다. 이 그림은 완성된 제어 코드가 아닙니다.</text></svg>