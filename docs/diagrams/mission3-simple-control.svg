 KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">자세·각속도 안정화</text><text x="1240.0" y="446" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">모터 출력 계산</text><rect x="1435" y="355" width="265" height="165" rx="12" fill="#eaf4ed" stroke="#687e91" stroke-width="2" /><text x="1567.5" y="372" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">기체 운동</text><text x="1567.5" y="413" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">차량 추종·접근</text><text x="1567.5" y="446" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">하강·패드 접촉</text><polyline points="315,437 385,437" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="385.00,437.00 373.29,442.65 373.29,431.35" fill="#687e91" /><polyline points="645,437 715,437" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="715.00,437.00 703.29,442.65 703.29,431.35" fill="#687e91" /><polyline points="1035,437 1115,437" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1115.00,437.00 1103.29,442.65 1103.29,431.35" fill="#687e91" /><polyline points="1365,437 1435,437" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="1435.00,437.00 1423.29,442.65 1423.29,431.35" fill="#687e91" /><polyline points="515,355 515,300" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="515.00,300.00 520.65,311.71 509.35,311.71" fill="#687e91" /><polyline points="875,300 875,355" fill="none" stroke="#687e91" stroke-width="3" stroke-linejoin="round" /><polygon points="875.00,355.00 869.35,343.29 880.65,3