<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="760" viewBox="0 0 1760 760" role="img"><title>미션3 간단 제어 블록선도</title><rect x="0" y="0" width="1760" height="760" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="55" y="30" font-family="Noto Sans CJK KR, sans-serif" font-size="36" fill="#183047" text-anchor="start" dominant-baseline="text-before-edge">미션 3 · 간단 제어 블록선도</text><text x="55" y="90" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#536679" text-anchor="start" dominant-baseline="text-before-edge">PC가 착륙 명령을 계산하고, 기체가 자세와 모터를 제어합니다.</text><rect x="355" y="145" width="710" height="405" rx="12" fill="#f6f9fe" stroke="#c6d5e5" stroke-width="2" /><text x="710" y="157" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">PC · 상태 추정과 상위 제어</text><rect x="1085" y="290" width="645" height="260" rx="12" fill="#f6faf7" stroke="#c7d8cc" stroke-width="2" /><text x="1407" y="305" font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">기체</text><rect x="385" y="205" width="650" height="95" rx="12" fill="#eaf2fc" stroke="#687e91" stroke-width="2" /><text x="710.0" y="222" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">단계 판단</text><text x="710.0" y="263" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" dominant-baseline="text-before-edge">대기 → 마커 인식 → 일직선 정렬 → 접근 → 착륙</text><rect x="55" y="355" width="260" height="165" rx="12" fill="#eaf4ed" stroke="#687e91" stroke-width="2" /><text x="185.0" y="372" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#183047" text-anchor="middle" dominant-baseline="text-before-edge">센서 입력</text><text x="185.0" y="413" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#536679" text-anchor="middle" do