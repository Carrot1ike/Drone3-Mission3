<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><style>text{font-family:Arial,'NanumGothic',sans-serif;fill:#183348} .s{font-size:17px}.b{font-size:21px;font-weight:bold}</style><rect width="1100" height="520" fill="#f6f9fb"/><text x="42" y="40" class="b">30 × 5m 직선 경기장 · 위에서 본 배치</text><rect x="45" y="80" width="1000" height="167" rx="6" fill="white" stroke="#375165" stroke-width="2"/><line x1="78" y1="164" x2="1012" y2="164" stroke="#168eaa" stroke-width="4"/><polygon points="1012,164 992,154 992,174" fill="#168eaa"/><text x="445" y="145" class="b">차량 직선 주행 28m → 동쪽</text><circle cx="78" cy="164" r="6" fill="#e58a2b"/><text x="62" y="115" class="s">출발 (1, 2.5)</text><text x="867" y="220" class="s">종점 (29, 2.5)</text><circle cx="112" cy="205.5" r="6" fill="#348569"/><text x="143" y="228" class="s">드론 (2, 2.5−d), z=1m</text><text x="46" y="284" class="s">같은 초기 x=2m에서 옆거리 d만 변경: 1.25 → 0.50m, 0.05m 간격</text><text x="46" y="320" class="b">초기 배치 확대 · 시선 각도</text><line x1="80" y1="363" x2="430" y2="363" stroke="#168eaa" stroke-width="3"/><rect x="98" y="353" width="22" height="20" fill="#e58a2b"/><text x="86" y="398" class="s">차량</text><circle cx="209" cy="460" r="7" fill="#348569"/><line x1="209" y1="460" x2="239" y2="377" stroke="#348569" stroke-width="4"/><polygon points="242,369 229,383 243,389" fill="#348569"/><line x1="209" y1="450" x2="209" y2="369" stroke="#698298" stroke-dasharray="5 4"/><text x="220" y="434" class="s">북→동 20°</text><text x="270" y="478" class="s">동 기준 yaw 70°</text><line x1="177" y1="363" x2="177" y2="460" stroke="#724faf"/><text x="112" y="442" class="s">d</text><text x="468" y="377" class="s">차량 출발점보다 드론이 동쪽 1m 앞</text><text x="468" y="414" class="s">카메라 공칭 수평 화각 87° · 화각 ≠ 인식 보장</text><text x="468" y="451" class="s">마커 발견 전 회전·주행선 접근 없이 대기</text><text x="468" y="488" class="s">아래 확대도는 설명용, 위 경기장 도면은 동일 축척</text></svg>